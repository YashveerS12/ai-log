name: Daily AI Log

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_and_log.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - run: |
          git config user.name "Yashveer Singh"
          git config user.email "harshitsingh00010@gmail.com"
          git add logs
          git commit -m "Daily AI log: $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
